    <rect x="280" y="20" width="240" height="860" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.4"/>
    <rect x="540" y="70" width="210" height="780" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.22"/>
    <rect x="770" y="40" width="260" height="830" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.35"/>
    <rect x="1040" y="90" width="180" height="720" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.2"/>
    <rect x="40" y="40" width="1180" height="4" fill="url(#edge)"/>
