  <rect width="1536" height="1024" fill="url(#sky)"/>
  <ellipse cx="1180" cy="210" rx="220" ry="90" fill="#fff6e8" opacity="0.35" filter="url(#soft)"/>
  <g transform="translate(180,80) skewX(-18)">
